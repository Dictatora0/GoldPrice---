<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoldPrice 黄金价格监控</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="shell">
      <header class="mast reveal" style="--delay: 0ms">
        <div>
          <p class="eyebrow">GoldPrice · 智能监控</p>
          <h1>黄金价格监控与买入信号</h1>
          <p class="subtitle">实时采集、多源校验、技术指标与本机通知</p>
        </div>
        <div class="status-pill" id="status-pill">连接中</div>
      </header>

      <section class="hero-grid">
        <article class="card hero-price reveal" style="--delay: 120ms">
          <div class="card-header">
            <span>最新价格</span>
            <span id="last-updated">--</span>
          </div>
          <div class="price-value" id="current-price">--</div>
          <div class="price-sub">
            <span id="price-change">--</span>
            <span class="muted">24小时涨跌</span>
          </div>
        </article>

        <article class="card hero-metrics reveal" style="--delay: 200ms">
          <div class="card-header">
            <span>关键指标</span>
            <span class="muted">当前</span>
          </div>
          <div class="metrics-grid">
            <div>
              <p class="label">RSI</p>
              <p id="metric-rsi" class="metric">--</p>
            </div>
            <div>
              <p class="label">波动率</p>
              <p id="metric-volatility" class="metric">--</p>
            </div>
            <div>
              <p class="label">MA30</p>
              <p id="metric-ma" class="metric">--</p>
            </div>
            <div>
              <p class="label">布林下轨</p>
              <p id="metric-bb" class="metric">--</p>
            </div>
          </div>
        </article>

        <article class="card hero-signal reveal" style="--delay: 280ms">
          <div class="card-header">
            <span>买入信号</span>
            <span class="muted">最近</span>
          </div>
          <p class="signal-state" id="signal-state">暂无信号</p>
          <p class="signal-sub" id="signal-reason">等待下一次分析</p>
        </article>
      </section>

      <section class="card chart-section reveal" style="--delay: 360ms">
        <div class="chart-header">
          <div>
            <h2>价格走势与信号</h2>
            <p class="muted">均线 / 布林带 / 信号点</p>
          </div>
          <div class="range-switch" id="range-switch">
            <button data-range="7D">7天</button>
            <button data-range="30D" class="active">30天</button>
            <button data-range="90D">90天</button>
            <button data-range="1Y">1年</button>
            <button data-range="ALL">全部</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="priceChart"></canvas>
        </div>
      </section>

      <section class="lower-grid">
        <article class="card reveal" style="--delay: 440ms">
          <div class="card-header">
            <span>指标速览</span>
            <span class="muted">更新中</span>
          </div>
          <ul class="indicator-list" id="indicator-list"></ul>
        </article>
        <article class="card reveal" style="--delay: 520ms">
          <div class="card-header">
            <span>信号历史</span>
            <span class="muted">最近30天</span>
          </div>
          <ul class="signal-list" id="signal-list"></ul>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/chart.js"></script>
  </body>
</html>
